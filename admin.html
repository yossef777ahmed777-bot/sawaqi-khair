<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة سواقي الخير</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#071810;color:#e9fff1}header{padding:18px 20px;background:#0d2a1d;border-bottom:1px solid #214634;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:22px;color:#91dfad}.wrap{max-width:900px;margin:24px auto;padding:0 16px}.card{background:#10291e;border:1px solid #244837;border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 12px 30px rgba(0,0,0,.18)}label{display:block;margin:12px 0 6px;color:#a9e6bd;font-weight:700}input,textarea,select{width:100%;padding:13px;border-radius:12px;border:1px solid #315642;background:#081a12;color:#fff;font-size:15px}textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:90px 1fr;gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;background:#16a15b;color:#fff}button.secondary{background:#29483a}button.danger{background:#c84f45}.msg{margin-top:12px;min-height:22px;color:#f2c85b}.hidden{display:none}.item{padding:15px;border:1px solid #294b39;border-radius:15px;margin-top:12px;background:#0b2117}.item-head{display:flex;align-items:center;gap:10px}.icon{font-size:24px}.muted{color:#91a99d;font-size:12px}.item h3{margin:0;color:#9be2b5}.item p{margin:8px 0;line-height:1.6}.topbtn{white-space:nowrap}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🌿 لوحة إدارة سواقي الخير</h1><button id="logoutBtn" class="secondary hidden">تسجيل خروج</button></header>
<div class="wrap">
  <div id="loginCard" class="card">
    <h2>🔐 تسجيل دخول الإدارة</h2>
    <label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username">
    <label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password">
    <div class="actions"><button id="loginBtn">دخول</button></div><div id="loginMsg" class="msg"></div>
  </div>
  <div id="adminCard" class="hidden">
    <div class="card">
      <h2>🔔 إضافة إشعار جديد</h2>
      <label>الأيقونة</label><input id="icon" value="🔔" maxlength="4">
      <label>العنوان بالعربي</label><input id="titleAr" placeholder="مثال: رحلة جديدة الأسبوع القادم">
      <label>نص الإشعار بالعربي</label><textarea id="textAr" placeholder="اكتب التفاصيل التي تريد أن يعرفها أولياء الأمور"></textarea>
      <label>العنوان بالإنجليزي</label><input id="titleEn" placeholder="Example: New trip next week">
      <label>نص الإشعار بالإنجليزي</label><textarea id="textEn" placeholder="Write the details for English visitors"></textarea>
      <div class="actions"><button id="addBtn">➕ نشر الإشعار</button><button id="clearBtn" class="secondary">مسح</button></div><div id="addMsg" class="msg"></div>
    </div>
    <div class="card"><h2>📋 الإشعارات المنشورة</h2><div id="list">جارٍ التحميل...</div></div>
  </div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCJOPKsp0tI2yW-6WrpWm3pI2P4tcVZNWQ",authDomain:"sawaqi-khair.firebaseapp.com",projectId:"sawaqi-khair",storageBucket:"sawaqi-khair.firebasestorage.app",messagingSenderId:"276356382810",appId:"1:276356382810:web:9b93b95962b83f48cf5863"};
const ADMIN_EMAIL="yossef777ahmed777@gmail.com";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
function msg(el,text){$(el).textContent=text;}
function showAdmin(user){
  const ok=user && (user.email||'').toLowerCase()===ADMIN_EMAIL;
  $('loginCard').classList.toggle('hidden',!!ok); $('adminCard').classList.toggle('hidden',!ok); $('logoutBtn').classList.toggle('hidden',!ok);
  if(user&&!ok){msg('loginMsg','هذا الحساب ليس حساب الإدارة المصرح به.');}
}
onAuthStateChanged(auth,user=>{showAdmin(user);});
$('loginBtn').onclick=async()=>{try{msg('loginMsg','جارٍ تسجيل الدخول...');await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);msg('loginMsg','');}catch(e){msg('loginMsg','بيانات الدخول غير صحيحة أو الحساب غير متاح.');}};
$('logoutBtn').onclick=()=>signOut(auth);
$('clearBtn').onclick=()=>{['titleAr','textAr','titleEn','textEn'].forEach(id=>$(id).value='');$('icon').value='🔔';msg('addMsg','');};
$('addBtn').onclick=async()=>{
  const user=auth.currentUser;
  if(!user||user.email.toLowerCase()!==ADMIN_EMAIL)return msg('addMsg','يجب تسجيل الدخول بحساب الإدارة.');
  const titleAr=$('titleAr').value.trim(),textAr=$('textAr').value.trim(),titleEn=$('titleEn').value.trim(),textEn=$('textEn').value.trim(),icon=$('icon').value.trim()||'🔔';
  if(!titleAr||!textAr){return msg('addMsg','اكتب عنوان ونص الإشعار بالعربي.');}
  try{msg('addMsg','جارٍ نشر الإشعار...');await addDoc(collection(db,'notifications'),{icon,titleAr,textAr,titleEn:titleEn||titleAr,textEn:textEn||textAr,createdAt:serverTimestamp(),createdBy:user.email});msg('addMsg','تم نشر الإشعار بنجاح ✅');$('clearBtn').click();}catch(e){console.error(e);msg('addMsg','لم يتم النشر. تأكد من صلاحيات Firestore.');}
};
let unsub;
function loadList(){if(unsub)unsub();unsub=onSnapshot(collection(db,'notifications'),snap=>{const arr=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const ta=a.createdAt?.toMillis?.()||0,tb=b.createdAt?.toMillis?.()||0;return tb-ta;});$('list').innerHTML=arr.length?arr.map(n=>`<div class="item"><div class="item-head"><span class="icon">${n.icon||'🔔'}</span><h3>${escapeHtml(n.titleAr||'إشعار')}</h3></div><p>${escapeHtml(n.textAr||'')}</p><div class="muted">${escapeHtml(n.titleEn||'')}</div><div class="muted">${escapeHtml(n.textEn||'')}</div><div class="actions"><button class="danger" data-id="${n.id}">حذف</button></div></div>`).join(''):'لا توجد إشعارات مضافة من لوحة الإدارة.';document.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=async()=>{if(confirm('حذف هذا الإشعار؟')){try{await deleteDoc(doc(db,'notifications',btn.dataset.id));}catch(e){alert('تعذر الحذف. تأكد من الصلاحيات.');}}});},err=>{$('list').textContent='تعذر قراءة الإشعارات. راجع صلاحيات Firestore.';console.error(err);});}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
onAuthStateChanged(auth,user=>{if(user&&user.email.toLowerCase()===ADMIN_EMAIL)loadList();else if(unsub){unsub();unsub=null;}});
</script>
</body></html>
